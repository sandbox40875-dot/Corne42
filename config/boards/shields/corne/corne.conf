# =====================================================
# Corne - Shared Configuration
# =====================================================

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MK42Keyboard"

# BLE Bonding & Security - FIX for Windows 11
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_BT_SETTINGS=y

# Connection Parameters - Windows 11 compatibility
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=30
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=99
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Bluetooth TX Power for stable connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Split Architecture
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

# Power Management & Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=14400000
CONFIG_ZMK_IDLE_TIMEOUT=30000

# HID Reports & Debouncing
CONFIG_ZMK_HID_IDLE_TIMEOUT=30000
CONFIG_ZMK_HID_MAX_UNBUFFERED_OUTPUT_REPORTS=10
CONFIG_ZMK_BT_PASSKEY_REQUIRED=n
CONFIG_ZMK_LOGGING=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_BT_L2CAP_TX_BUF_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_ZMK_KEYBOARD_REPORT_MODE=NKRO
CONFIG_ZMK_HID_REPORT_POLL_INTERVAL=1
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# =====================================================
# OLED Display (Standard Built-in Screen)
# =====================================================
CONFIG_ZMK_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y